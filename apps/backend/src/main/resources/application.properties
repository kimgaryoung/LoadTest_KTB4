# Server Configuration
spring.config.import=optional:file:.env[.properties],optional:file:apps/backend/.env[.properties]

server.port=${PORT:5001}

# Tunable defaults for the challenge traffic baseline. Keep DB/Redis pools
# aligned with these limits in the deployment environment.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:2000}

# Database Configuration
# Spring Boot 4: connection settings moved from spring.data.mongodb.* to spring.mongodb.*
spring.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Redis A: login sessions and rate limits. REDIS_* fallbacks support a one-step rollout.
app.redis.auth.host=${AUTH_REDIS_HOST:${REDIS_HOST:localhost}}
app.redis.auth.port=${AUTH_REDIS_PORT:${REDIS_PORT:6379}}
app.redis.auth.password=${AUTH_REDIS_PASSWORD:${REDIS_PASSWORD:}}
app.redis.auth.connect-timeout=${AUTH_REDIS_CONNECT_TIMEOUT:${REDIS_CONNECT_TIMEOUT:2s}}
app.redis.auth.command-timeout=${AUTH_REDIS_COMMAND_TIMEOUT:${REDIS_COMMAND_TIMEOUT:2s}}
app.redis.auth.ssl=${AUTH_REDIS_SSL:${REDIS_SSL:false}}
# Redis B: public profile cache and Socket.IO store/pub-sub.
app.redis.realtime.host=${REALTIME_REDIS_HOST:${REDIS_HOST:localhost}}
app.redis.realtime.port=${REALTIME_REDIS_PORT:${REDIS_PORT:6379}}
app.redis.realtime.password=${REALTIME_REDIS_PASSWORD:${REDIS_PASSWORD:}}
app.redis.realtime.connect-timeout=${REALTIME_REDIS_CONNECT_TIMEOUT:${REDIS_CONNECT_TIMEOUT:2s}}
app.redis.realtime.command-timeout=${REALTIME_REDIS_COMMAND_TIMEOUT:${REDIS_COMMAND_TIMEOUT:2s}}
app.redis.realtime.ssl=${REALTIME_REDIS_SSL:${REDIS_SSL:false}}
ratelimit.store=${RATE_LIMIT_STORE:redis}
# Login sessions initially share the existing Redis. Set SESSION_STORE=mongo for rollback.
session.store=${SESSION_STORE:redis}

# Read-through cache for public user profile fields. Cache failures fall back to MongoDB.
app.cache.user-profile.enabled=${USER_PROFILE_CACHE_ENABLED:true}
app.cache.user-profile.ttl=${USER_PROFILE_CACHE_TTL:60s}

# File Upload Configuration
# Storage type: local or s3 (default: local)
file.storage.type=${FILE_STORAGE_TYPE:local}
file.upload-dir=./uploads
file.direct-upload.enabled=${FILE_DIRECT_UPLOAD_ENABLED:false}
file.presign.put-ttl=${FILE_PRESIGN_PUT_TTL:10m}
file.presign.get-ttl=${FILE_PRESIGN_GET_TTL:5m}
file.pending-retention=${FILE_PENDING_RETENTION:24h}
file.cleanup.interval=${FILE_CLEANUP_INTERVAL:10m}
file.cleanup.initial-delay=${FILE_CLEANUP_INITIAL_DELAY:10m}
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# Security Configuration
app.encryption.key=${ENCRYPTION_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
app.encryption.salt=${ENCRYPTION_SALT:3132333435363738}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}
# AI is outside this year's E2E/load scenarios. Keep it opt-in so an
# accidental mention never consumes external capacity during the challenge.
chat.ai.enabled=${CHAT_AI_ENABLED:false}

# Socket.IO Server Configuration
socketio.server.host=0.0.0.0
socketio.server.port=${WS_PORT:5002}
socketio.server.origin=${SOCKETIO_SERVER_ORIGIN:*}
# Use `redis` for a shared Socket.IO store/pub-sub in multi-WAS deployments.
socketio.store=${SOCKETIO_STORE:redis}
# Send participant deltas to existing room members. Set false for rollback.
socketio.participant-delta.enabled=${SOCKETIO_PARTICIPANT_DELTA_ENABLED:false}

# Graceful shutdown prevents a deployment from dropping in-flight HTTP work.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ktb.chatapp=INFO
logging.level.org.mongodb=INFO

# Content Moderation
chatapp.banned-word.location=classpath:fake_banned_words_10k.txt

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.packages-to-scan=com.ktb.chatapp.controller
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=read-only
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name:ktb-chat-backend}
management.metrics.tags.host=${HOSTNAME:unknown}
