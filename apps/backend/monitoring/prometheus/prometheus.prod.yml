global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/backend-apps.prod.yml'
        refresh_interval: 5s

  - job_name: 'mongodb'
    static_configs:
      - targets: ['IP:9216'] # your-mongo-server
        labels:
          environment: 'production'

  - job_name: 'redis-auth'
    static_configs:
      - targets: ['AUTH_REDIS_IP:9121']
        labels:
          environment: 'production'
          role: 'auth'

  - job_name: 'redis-realtime'
    static_configs:
      - targets: ['REALTIME_REDIS_IP:9121']
        labels:
          environment: 'production'
          role: 'realtime'

  - job_name: 'node-exporter'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/node-exporters.prod.yml'
        refresh_interval: 5s
